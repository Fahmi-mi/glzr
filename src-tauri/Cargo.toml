[package]
name = "glzr"
version = "0.1.0"
description = "Terminal-first workspace yang ringan: terminal, editor file, git panel, dan preview localhost dalam satu aplikasi."
authors = ["Fahmi"]
license = "MIT"
edition = "2021"

[lib]
name = "glzr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-cli = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
portable-pty = "0.8"
notify = "7"
tokio = { version = "1", features = ["sync", "process", "rt", "time", "macros"] }
toml = "0.8"
trash = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
